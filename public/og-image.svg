<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a10" />
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0a0a10" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)" />

  {<!-- grid -->}
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  {<!-- abstract cards -->}
  <rect x="760" y="130" width="340" height="220" rx="20" fill="#13131c" stroke="#6366f1" stroke-width="2" />
  <rect x="790" y="160" width="280" height="24" rx="6" fill="#6366f1" />
  <rect x="790" y="200" width="200" height="12" rx="3" fill="#334155" />
  <rect x="790" y="224" width="160" height="12" rx="3" fill="#334155" />

  <rect x="820" y="380" width="300" height="160" rx="20" fill="#13131c" stroke="#22d3ee" stroke-width="2" />
  <rect x="850" y="410" width="240" height="20" rx="5" fill="#22d3ee" />
  <rect x="850" y="444" width="180" height="10" rx="2" fill="#334155" />
  <rect x="850" y="464" width="140" height="10" rx="2" fill="#334155" />

  {<!-- text -->}
  <text x="60" y="280" font-family="Inter, sans-serif" font-size="72" font-weight="700" fill="white">BrandOps</text>
  <text x="60" y="340" font-family="Inter, sans-serif" font-size="32" fill="#b4b4c7">Review-first content automation</text>
  <text x="60" y="380" font-family="Inter, sans-serif" font-size="32" fill="#b4b4c7">for LinkedIn carousels & newsletters</text>

  {<!-- pipeline dots -->}
  <circle cx="60" cy="470" r="8" fill="#6366f1" />
  <circle cx="110" cy="470" r="8" fill="#6366f1" />
  <circle cx="160" cy="470" r="8" fill="#6366f1" />
  <circle cx="210" cy="470" r="8" fill="#22d3ee" />
  <line x1="68" y1="470" x2="102" y2="470" stroke="#6366f1" stroke-width="2" />
  <line x1="118" y1="470" x2="152" y2="470" stroke="#6366f1" stroke-width="2" />
  <line x1="168" y1="470" x2="202" y2="470" stroke="#6366f1" stroke-width="2" />
</svg>
